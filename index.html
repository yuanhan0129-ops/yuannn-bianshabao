<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4edda" />
    <title>皮卡丘快跑！</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
    <script defer src="game.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <div class="brand-mark" aria-hidden="true"><span class="ear left"></span><span class="face">⚡</span><span class="ear right"></span></div>
        <div>
          <p class="eyebrow">PIKA RUN · THREE WORLDS</p>
          <h1>皮卡丘快跑！</h1>
          <p class="subtitle">穿越三個場景，挑戰成為寶可夢大師！</p>
        </div>
        <div class="header-note"><span class="note-dot"></span>三個場景 · 1500 分後挑戰成功</div>
      </header>

      <section class="game-card" aria-label="皮卡丘快跑遊戲">
        <div class="game-toolbar">
          <div class="toolbar-label"><span class="toolbar-icon">✦</span> 跑酷挑戰</div>
          <div class="goal-pill">每 500 分加速 · 1500 分後續跑</div>
        </div>
        <div id="game-root" class="game-root"></div>
        <div class="game-footer">
          <div class="control-hint"><span class="keycap wide">空白鍵</span><span class="keycap">↑</span> 跳躍</div>
          <div class="control-hint"><span class="keycap">↓</span> 蹲下</div>
          <button id="attack-button" class="attack-button" type="button" aria-label="使出十萬伏特">⚡ 十萬伏特 <kbd>Z</kbd></button>
          <div class="control-hint"><span class="tap-icon">●</span> 點擊左側跳躍，按住右側蹲下</div>
        </div>
      </section>

      <p class="gentle-reminder">敵人靠近時按 Z 或點「十萬伏特」擊倒牠；超過 1500 分後繼續跑，倒下時顯示挑戰成功！</p>
    </main>
  </body>
</html>
