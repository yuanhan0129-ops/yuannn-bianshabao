<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5efe4" />
    <title>情緒能量補給站</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
    <script defer src="game.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <div>
          <p class="eyebrow">CLASSROOM · RESET & PLAY</p>
          <h1>情緒能量補給站</h1>
          <p class="subtitle">把壓力交給沙包和泡泡，讓心情慢慢回到舒服的位置。</p>
        </div>
        <div class="header-note"><span class="note-dot"></span>安全釋放，照顧自己</div>
      </header>

      <section class="game-card" aria-label="情緒能量補給站遊戲">
        <div class="game-toolbar">
          <div class="toolbar-label"><span class="toolbar-icon">✳</span> 今日補給任務</div>
          <div class="goal-pill">集滿 <strong>100</strong> 能量完成任務</div>
        </div>
        <div id="game-root" class="game-root"></div>
        <div class="game-footer">
          <div class="control-hint"><span class="keycap">←</span><span class="keycap">→</span> 移動角色</div>
          <div class="control-hint"><span class="keycap wide">空白鍵</span> 揮拳打沙包</div>
          <div class="control-hint"><span class="tap-icon">●</span> 點擊泡泡，輕鬆消除壓力</div>
        </div>
      </section>

      <p class="gentle-reminder">如果現在心情很滿，先停一下、深呼吸，也可以找信任的大人聊聊。</p>
    </main>
  </body>
</html>
